# Configuración de nginx para admin.botavaracordoba.es
#
# Instalar:
#   1. Copia este archivo a /etc/nginx/sites-available/admin.botavaracordoba.es
#   2. Enlázalo: ln -s /etc/nginx/sites-available/admin.botavaracordoba.es /etc/nginx/sites-enabled/
#   3. Comprueba la sintaxis: nginx -t
#   4. Recarga: systemctl reload nginx
#   5. Genera el certificado HTTPS con certbot (ver README de deploy/), que
#      reescribirá este archivo añadiendo el bloque server 443/ssl automáticamente.
#
# Cambia APP_PORT si tu .env usa un PORT distinto de 3000.

server {
    listen 80;
    listen [::]:80;
    server_name admin.botavaracordoba.es;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Cabeceras estándar para que la app vea el host/IP reales del
        # visitante en vez de los de nginx.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Necesario para que las cookies de sesión (login del panel)
        # funcionen correctamente detrás del proxy.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
